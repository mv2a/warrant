<rect width="900" height="574" rx="10" fill="#0d1117"/>
<path d="M0 10a10 10 0 0 1 10-10h880a10 10 0 0 1 10 10v26H0z" fill="#161b22"/>
<circle cx="22" cy="18" r="6" fill="#ff5f57"/><circle cx="42" cy="18" r="6" fill="#febc2e"/><circle cx="62" cy="18" r="6" fill="#28c840"/>
<text x="450.0" y="22" text-anchor="middle" fill="#8b949e">examples/pricing/demo.sh</text>
<text class="l" style="animation-name:l0" x="22" y="60"><tspan fill="#8b949e"># Candidate A was written by a coding agent. It passes every check it can see.</tspan></text>
<text class="l" style="animation-name:l1" x="22" y="79"><tspan fill="#3fb950">$</tspan><tspan fill="#e6edf3"> warrant verify --workspace candidates/overfit --audience builder</tspan></text>
<rect class="c" style="animation-name:c1" x="37.6" y="65" width="900" height="19" fill="#0d1117"/>
<text class="l" style="animation-name:l2" x="22" y="98"><tspan fill="#c9d1d9">Verified candidates/overfit (sha256:7bb39c5c3689) with 7 checks.</tspan></text>
<text class="l" style="animation-name:l3" x="22" y="117"><tspan fill="#c9d1d9"></tspan></text>
<text class="l" style="animation-name:l4" x="22" y="136"><tspan fill="#c9d1d9">  </tspan><tspan font-weight="bold" fill="#3fb950">PASS</tspan><tspan fill="#c9d1d9">   P1   visible  The quote command follows the published contract: valid requests get wh…</tspan></text>
<text class="l" style="animation-name:l5" x="22" y="155"><tspan fill="#c9d1d9">  </tspan><tspan font-weight="bold" fill="#3fb950">PASS</tspan><tspan fill="#c9d1d9">   P2   visible  The three example orders in the intent are charged exactly what the int…</tspan></text>
<text class="l" style="animation-name:l6" x="22" y="174"><tspan fill="#d29922">  hidden checks: 3 passed, 2 did not</tspan></text>
<text class="l" style="animation-name:l7" x="22" y="193"><tspan fill="#c9d1d9"></tspan></text>
<text class="l" style="animation-name:l8" x="22" y="212"><tspan fill="#d29922">Promises the hidden checks found unmet:</tspan></text>
<text class="l" style="animation-name:l9" x="22" y="231"><tspan fill="#c9d1d9">  C1  Money is counted in whole cents. A discount that works out to a fraction of a cent is rou…</tspan></text>
<text class="l" style="animation-name:l10" x="22" y="250"><tspan fill="#c9d1d9">  C3  Invalid requests are refused, never priced. That includes a subtotal that is negative, fr…</tspan></text>
<text class="l" style="animation-name:l11" x="22" y="269"><tspan fill="#8b949e">Re-read those promises. The hidden checks won&#x27;t say more.</tspan></text>
<text class="l" style="animation-name:l12" x="22" y="288"><tspan fill="#c9d1d9"></tspan></text>
<text class="l" style="animation-name:l13" x="22" y="307"><tspan fill="#c9d1d9">5 passed, 2 did not. Evidence recorded in ledger entry #2.</tspan></text>
<text class="l" style="animation-name:l14" x="22" y="326"><tspan fill="#c9d1d9"></tspan></text>
<text class="l" style="animation-name:l15" x="22" y="345"><tspan fill="#3fb950">$</tspan><tspan fill="#e6edf3"> warrant gate merge --workspace candidates/overfit</tspan></text>
<rect class="c" style="animation-name:c15" x="37.6" y="331" width="900" height="19" fill="#0d1117"/>
<text class="l" style="animation-name:l16" x="22" y="364"><tspan fill="#c9d1d9">merge: </tspan><tspan font-weight="bold" fill="#f85149">DENIED</tspan><tspan fill="#c9d1d9"> for candidates/overfit (sha256:7bb39c5c3689)</tspan></text>
<text class="l" style="animation-name:l17" x="22" y="383"><tspan fill="#f85149">  - H2 failed</tspan></text>
<text class="l" style="animation-name:l18" x="22" y="402"><tspan fill="#f85149">  - H5 failed</tspan></text>
<text class="l" style="animation-name:l19" x="22" y="421"><tspan fill="#c9d1d9"></tspan></text>
<text class="l" style="animation-name:l20" x="22" y="440"><tspan fill="#8b949e"># Candidate B was written by another agent.</tspan></text>
<text class="l" style="animation-name:l21" x="22" y="459"><tspan fill="#3fb950">$</tspan><tspan fill="#e6edf3"> warrant gate merge --workspace candidates/honest</tspan></text>
<rect class="c" style="animation-name:c21" x="37.6" y="445" width="900" height="19" fill="#0d1117"/>
<text class="l" style="animation-name:l22" x="22" y="478"><tspan fill="#c9d1d9">merge: </tspan><tspan font-weight="bold" fill="#3fb950">WARRANTED</tspan><tspan fill="#c9d1d9"> for candidates/honest (sha256:fd797c2edfda)</tspan></text>
<text class="l" style="animation-name:l23" x="22" y="497"><tspan fill="#c9d1d9">  strength   tested</tspan></text>
<text class="l" style="animation-name:l24" x="22" y="516"><tspan fill="#c9d1d9">  grounds    passing evidence from P1, P2, H1, H2, H3, H4, H5</tspan></text>
<text class="l" style="animation-name:l25" x="22" y="535"><tspan fill="#8b949e">  caveat     only checks the builder could see cover C4, S1, S2, S3</tspan></text>
</svg>
