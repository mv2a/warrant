<svg xmlns="http://www.w3.org/2000/svg" width="900" height="574" viewBox="0 0 900 574" role="img" aria-label="Warrant demo: an agent-written implementation passes every visible check, hidden checks find two broken promises, and the merge is denied; a second implementation earns a warrant." xml:space="preserve">
