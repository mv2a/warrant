name: Publish to PyPI

# Runs when a release is published, or by hand from the Actions tab.
# It uses PyPI trusted publishing, so no token is stored anywhere. One-time setup on PyPI:
# add a trusted publisher for project "warrant-cli", owner "mv2a", repository "warrant",
# workflow "publish.yml" and environment "pypi".

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Check that the release tag matches the version
        if: github.event_name == 'release'
        run: |
          version=$(python -c "import warrant; print(warrant.__version__)")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "warrant/__init__.py says $version, but the release is $GITHUB_REF_NAME"
            exit 1
          fi
      - name: Build
        run: |
          python -m pip install build
          python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
