name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Unit and end-to-end tests
        run: python -m unittest discover -s tests -t . -v
      - name: Walkthrough
        run: examples/pricing/demo.sh
        env:
          PYTHON: python
      - name: Package installs and runs
        run: |
          python -m pip install .
          warrant --version
